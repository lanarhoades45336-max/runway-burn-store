<style>

*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:"JetBrains Mono",monospace;

.wrap{position:relative;max-width:960px;margin:0 auto;padding:90px 26px;width:100%}

  font-size:clamp(44px,10vw,110px);letter-spacing:-.045em;line-height:.88;margin:0 0 20px}
h1 em{font-style:normal;color:var(--ember)}

.card{display:flex;justify-content:space-between;align-items:center;gap:18px;text-decoration:none;color:var(--paper);

  transition:transform .4s var(--ease),border-color .4s;background:rgba(19,19,23,.7);backdrop-filter:blur(6px)}
.card:hover{border-color:rgba(244,241,233,.26);transform:translateY(-4px)}
.card-name{font-family:"Space Grotesk",sans-serif;font-weight:600;text-transform:uppercase;
  font-size:24px;letter-spacing:-.02em}
.card-price{font-size:12.5px;color:var(--dim);white-space:nowrap}
.muted{color:var(--dim)}
footer{margin-top:60px;font-size:12px;color:var(--dim)}
